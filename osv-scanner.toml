# Advisories that do not reach anything we ship.
#
# Every entry here has a reason, and the reason is the point: a suppression file
# without one becomes a place where real findings go to be forgotten. Nothing is
# ignored because it is inconvenient — the two categories below are "not in the
# binary" and "unmaintained, no defect claimed".
#
# This file does not silence new findings. Anything not listed by ID still fails
# the scan, which is what it is for.
#
# Re-derive the first category with:
#   cargo metadata --filter-platform aarch64-apple-darwin
# and check whether the crate is in resolve.nodes. If it is, it ships, and the
# entry has to come out.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0411"
reason = """Linux-only GUI stack. Tauri depends on gtk-rs for its Linux target, so these appear in a Cargo.lock that is platform-agnostic by design, but nothing here is compiled into the macOS or Windows binaries that are actually distributed. Verified with `cargo metadata --filter-platform`: absent from aarch64-apple-darwin, x86_64-apple-darwin and x86_64-pc-windows-msvc."""

