<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="hanji">
  <!--
    A sheet of paper with a seal on it. The seal is the same green the app
    spends its single accent on, because the mark and the network-zero badge
    are making the same promise.
    Colours are literal rather than tokens: this file is fetched by the browser
    chrome, outside the page's CSS.
  -->
  <rect width="64" height="64" rx="12" fill="#faf8f4" />
  <rect width="64" height="64" rx="12" fill="none" stroke="#dcd8d0" stroke-width="1.5" />
  <g stroke="#2b2925" stroke-width="3" stroke-linecap="round">
    <path d="M16 20h32" />
    <path d="M16 30h32" />
    <path d="M16 40h20" />
  </g>
  <circle cx="45" cy="45" r="8" fill="#1f9254" />
  <path d="M41.5 45.2l2.6 2.6 4.6-5" fill="none" stroke="#faf8f4" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
