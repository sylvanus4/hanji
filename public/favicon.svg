<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="hanji">
  <!--
    A seal with ㅎ carved out of it — the first letter of 한지, in the same green
    the app spends its only accent on. The design system calls that token
    `--seal`, so the mark and the network-zero badge are literally made of the
    same thing, and the icon is a stamp rather than a picture of a document.

    Three earlier drafts were rendered at 1024, 128, 48 and 32 pixels and looked
    at side by side. A sheet of paper with a small seal in the corner read fine
    large and turned to mud by 48, because it asks two shapes to survive where
    one barely does. A solid block with a single glyph knocked out of it is the
    highest-contrast thing available at tab and dock size, so that is what this
    is.

    The corner radius is tight here and much rounder in the app icon. That is
    deliberate rather than inconsistent: the design tokens call for nearly square
    corners because this is a paper tool, while macOS composites every icon into
    a squircle and a near-square one looks foreign in a dock. See
    src-tauri/icons/source.svg.

    Colours are literal rather than tokens: this file is fetched by the browser
    chrome, outside the page's CSS.
  -->
  <rect x="2" y="2" width="60" height="60" rx="8" fill="#008231" />
  <g fill="none" stroke="#fcfaf7" stroke-width="5" stroke-linecap="round">
    <path d="M32 12.5v4.5" />
    <path d="M20.5 24h23" />
  </g>
  <circle cx="32" cy="40.5" r="9.5" fill="none" stroke="#fcfaf7" stroke-width="5" />
</svg>
