<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="hanji">
  <!--
    A stamped sheet of paper.

    The mark this replaced was a green rounded tile carrying a Hangul letter,
    and it borrowed two identities at once: a green tile with a white glyph
    reads as a well-known spreadsheet, and a Korean consonant on a coloured tile
    reads as the office suite this tool sits beside. Neither is ours to take,
    and a document tool wearing somebody else's mark makes a claim about where
    it came from before anyone has opened it.

    So it says what the thing is rather than spelling its name: warm paper, a
    heading, a few lines of body, and a seal in the corner — the shape a Korean
    official document takes once somebody has actually approved it. No
    letterform, which also means it needs no redrawing to mean the same thing
    in English.

    The heading is short and heavier than the body. Three lines of equal weight
    would read as a hamburger menu at small sizes, which was the first attempt
    and the reason this one has a title.

    Paper #ede3d2, ink #22252a, seal #b23a2e. The seal sits nine degrees off
    square because a stamp pressed by hand never lands straight, and that tilt
    is most of what keeps a red square from reading as a flag.
  -->
  <rect x="2" y="2" width="60" height="60" rx="10" fill="#ede3d2" />
  <g stroke="#22252a" stroke-linecap="round" fill="none">
    <path d="M14 18h22" stroke-width="5" />
    <g stroke-width="3.5">
      <path d="M14 28h34" />
      <path d="M14 35h34" />
      <path d="M14 42h22" />
    </g>
  </g>
  <rect x="41" y="44" width="13" height="13" rx="3" fill="#b23a2e"
        transform="rotate(-9 47.5 50.5)" />
</svg>
