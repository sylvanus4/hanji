<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-label="hanji — 문서가 이 기기를 벗어나지 않습니다">
  <!--
    Link preview card. Distribution for this category is GitHub and Hacker News,
    where this image is most of the first impression, so it says the one thing
    worth knowing rather than showing a screenshot of an interface nobody has
    reason to care about yet.

    Served from our own origin as an SVG. A third-party image host would put a
    tracker on a card whose entire claim is that nothing leaves your machine.

    Colours are literal: this is fetched by crawlers, outside the page's CSS.
    They match tokens.css — paper #fcfaf7, ink #1a1814, ink-faint #5a5854,
    rule #dcdad7. The badge keeps its green because green is what the badge
    means in the app; the mark no longer uses it.
  -->
  <rect width="1200" height="630" fill="#fcfaf7" />

  <!-- The mark, at the size one can carry a card. Kept in step with
       public/favicon.svg, which explains why it is a stamped sheet and not a
       letter on a coloured tile. -->
  <g transform="translate(96 96) scale(2.0625)">
    <rect width="64" height="64" rx="10" fill="#ede3d2" />
    <g stroke="#22252a" stroke-linecap="round" fill="none">
      <path d="M14 18h22" stroke-width="5" />
      <g stroke-width="3.5">
        <path d="M14 28h34" />
        <path d="M14 35h34" />
        <path d="M14 42h22" />
      </g>
    </g>
    <rect x="41" y="44" width="13" height="13" rx="3" fill="#b23a2e"
          transform="rotate(-9 47.5 50.5)" />
  </g>

  <text x="256" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="58"
        fill="#1a1814" letter-spacing="-1">hanji</text>
  <text x="256" y="196" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="19" fill="#5a5854" letter-spacing="1.6">LOCAL ONLY · 이 기기 안에서</text>

  <text x="96" y="342" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="60" font-weight="600" fill="#1a1814">문서가 이 기기를 벗어나지 않습니다</text>
  <text x="96" y="410" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="27" fill="#5a5854">한글(HWP·HWPX), PDF, 이미지, 동영상을 열고 변환합니다.</text>
  <text x="96" y="450" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="27" fill="#5a5854">업로드가 없으니 나중에 지울 것도 없습니다.</text>

  <line x1="96" y1="516" x2="1104" y2="516" stroke="#dcdad7" stroke-width="1" />

  <!-- The proof, stated as the app states it: a count, not an adjective. -->
  <g transform="translate(96 550)">
    <rect width="188" height="40" rx="20" fill="#008231" opacity="0.10" />
    <circle cx="26" cy="20" r="5" fill="#008231" />
    <text x="44" y="27" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
          font-size="17" font-weight="600" fill="#008231">전송 0 · 0 sent</text>
  </g>
  <text x="316" y="577" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif"
        font-size="17" fill="#5a5854">macOS · Windows · 브라우저 · 오픈소스</text>
</svg>
