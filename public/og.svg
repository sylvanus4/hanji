<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"
     aria-label="hanji — 문서가 이 기기를 벗어나지 않습니다">
  <!--
    Link-preview card. Self-hosted rather than generated by an image service,
    which would mean this project's own share card made a third-party request.
    System font stacks only — a preview renderer will not load a webfont, and a
    missing font would silently collapse the layout.
  -->
  <rect width="1200" height="630" fill="#faf8f4" />
  <rect x="0" y="0" width="1200" height="8" fill="#1f9254" />

  <text x="88" y="168" font-family="Georgia, 'Nanum Myeongjo', serif" font-size="76" fill="#2b2925">
    hanji
  </text>
  <text x="262" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="26"
        letter-spacing="3" fill="#8d867c">이 기기 안에서</text>

  <text x="88" y="286" font-family="system-ui, 'Apple SD Gothic Neo', sans-serif"
        font-size="54" font-weight="600" fill="#2b2925">
    문서가 이 기기를 벗어나지 않습니다
  </text>
  <text x="88" y="352" font-family="system-ui, 'Apple SD Gothic Neo', sans-serif"
        font-size="30" fill="#5c564e">
    한글(HWP·HWPX) · PDF · 이미지를 브라우저 안에서 열고 변환합니다.
  </text>
  <text x="88" y="398" font-family="system-ui, 'Apple SD Gothic Neo', sans-serif"
        font-size="30" fill="#5c564e">
    업로드가 없으니 나중에 지울 것도 없습니다.
  </text>

  <g transform="translate(88 470)">
    <rect width="232" height="52" rx="26" fill="#1f925419" stroke="#1f9254" stroke-width="1.5" />
    <circle cx="30" cy="26" r="6" fill="#1f9254" />
    <text x="50" y="34" font-family="system-ui, sans-serif" font-size="21"
          letter-spacing="2" fill="#1f9254">전송 0 · 0 SENT</text>
  </g>

  <text x="88" y="576" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" fill="#8d867c">
    HWP → HWPX · PDF · PNG   /   공공기관 개방형 포맷 변환
  </text>
</svg>
