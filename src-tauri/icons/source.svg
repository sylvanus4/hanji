<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="hanji">
  <!--
    Application icon. The same mark as public/favicon.svg at the size the icon
    pipeline wants; the two are changed together or not at all.

    A stamped sheet of paper: warm paper, a heading, body lines, a seal. It
    replaced a green tile carrying a Hangul letter, which read as a well-known
    spreadsheet on one hand and as the Korean office suite this tool sits
    beside on the other.

    The tile is inset rather than full-bleed because macOS composites its own
    rounded mask, and artwork that already fills the square comes back with its
    corners shaved. The canvas around it stays transparent.

    Regenerate the platform icons after editing:
      render this to src-tauri/icons/source.png at 1024, then
      npm run tauri icon -- src-tauri/icons/source.png
  -->
  <rect x="102" y="102" width="820" height="820" rx="180" fill="#ede3d2" />
  <g stroke="#22252a" stroke-linecap="round" fill="none">
    <path d="M266 321h301" stroke-width="68" />
    <g stroke-width="48">
      <path d="M266 457h465" />
      <path d="M266 553h465" />
      <path d="M266 649h301" />
    </g>
  </g>
  <rect x="635" y="676" width="178" height="178" rx="41" fill="#b23a2e"
        transform="rotate(-9 724 765)" />
</svg>
